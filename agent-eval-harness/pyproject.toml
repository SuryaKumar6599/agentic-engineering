[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eval-harness"
version = "0.1.0"
description = "Production-grade eval suite: task success, tool-call accuracy, cost, latency, regression CI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  # Core eval frameworks
  "deepeval>=1.4",
  "ragas>=0.2",
  # Observability
  "langfuse>=2.36",
  # LLM clients
  "openai>=1.30",
  "anthropic>=0.28",
  # Async + data
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "rich>=13.7",
  "typer>=0.12",
  "pandas>=2.2",
  "jinja2>=3.1",
  # Testing
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-xdist>=3.5",
  "pytest-timeout>=2.3",
  "anyio>=4.4",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "mypy>=1.10", "pre-commit>=3.7"]

[project.scripts]
agent-eval = "harness.cli:app"
eval = "harness.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["evals", "tests"]
addopts = "-v --tb=short --timeout=120"
markers = [
  "unit: fast unit tests, no LLM calls",
  "integration: calls real LLMs (needs API keys)",
  "regression: golden-dataset regression suite",
  "slow: > 30 s per test",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["harness*", "agents*"]
