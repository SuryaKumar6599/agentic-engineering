[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fda-trials-mcp"
version = "0.1.0"
description = "An MCP server exposing openFDA (drug labels, adverse events, recalls) and ClinicalTrials.gov v2 data to LLM clients."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Contributors" }
]
keywords = ["mcp", "openfda", "clinicaltrials", "healthcare", "fda", "llm"]
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
]

[project.scripts]
fda-trials-mcp = "fda_trials_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fda_trials_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
