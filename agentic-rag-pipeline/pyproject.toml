[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-rag-pipeline"
version = "0.1.0"
description = "Agentic RAG Pipeline for Context-Aware Task Detection"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-openai>=0.2",
    "faiss-cpu>=1.8",
    "sentence-transformers>=3.0",
    "networkx>=3.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "tiktoken>=0.7",
    "pypdf>=4.0",
    "rich>=13.0",
    "langchain-huggingface>=1.2.2",
    "langchain-faiss>=0.1.1",
    "langchainhub>=0.1.21",
    "streamlit>=1.60.0",
    "nest-asyncio>=1.6.0",
    "duckduckgo-search>=8.1.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-mock>=3.14"]

[project.scripts]
rag = "main:cli"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "tools", "schemas", "configs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
